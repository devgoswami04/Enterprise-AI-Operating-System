services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-ai-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_ai_os
      POSTGRES_USER: enterprise_ai
      POSTGRES_PASSWORD: enterprise_ai
    ports:
      - "5432:5432"
    volumes:
      - enterprise_ai_os_pgdata:/var/lib/postgresql/data
      - ./drizzle/0000_enterprise_ai_os.sql:/docker-entrypoint-initdb.d/0000_enterprise_ai_os.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_ai -d enterprise_ai_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  enterprise_ai_os_pgdata:
